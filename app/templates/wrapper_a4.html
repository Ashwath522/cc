<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Tags</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Mr Eaves XL Modern", sans-serif;
      background: #f8f4e9; /* Beige background on entire page */
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      width: 29.7cm;
      height: 21cm;
      box-sizing: border-box;
      overflow: hidden;
    }
    .tag-container {
      flex: 1;
      padding: 0.5cm;
      box-sizing: border-box;
    }
    .tag-container:not(:last-child) {
      border-right: 0.7cm solid transparent;
    }
    @font-face {
        font-family: "Mr Eaves XL Modern";
        font-style: normal;
        font-weight: 400;
        src: url("./fonts/woff/mr-eaves-xl-modern-regular.woff") format("woff");
    }

    @font-face {
        font-family: "Mr Eaves XL Modern Bold";
        src: url("./fonts/woff/mr-eaves-xl-modern-bold.woff") format("woff");
    }

    @font-face {
        font-family: "Rupee Foradian";
        font-style: normal;
        src: url("./fonts/rupee_foradian.ttf") format("truetype");
    }

    @font-face {
        font-family: "Mr Eaves XL Modern Heavy";
        font-style: normal;
        src: url("./fonts/mr_eaves_xl_modern_heavy.ttf") format("truetype");
    }
  </style>
</head>
<body>
  <div class="tag-container">{{{tag1}}}</div>
  <div class="tag-container">{{{tag2}}}</div>
  <div class="tag-container">{{{tag3}}}</div>
</body>
</html>
